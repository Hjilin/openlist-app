name: Build PocketNAS-Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download OpenList arm64 binary (with Web frontend)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp
          curl -fL -o openlist.tar.gz "https://github.com/OpenListTeam/OpenList/releases/download/v4.2.6/openlist-linux-musl-arm64.tar.gz"
          tar xzf openlist.tar.gz
          cp openlist /home/runner/work/PocketNAS-Pro/PocketNAS-Pro/app/src/main/jniLibs/arm64-v8a/libopenlist.so
          chmod +x /home/runner/work/PocketNAS-Pro/PocketNAS-Pro/app/src/main/jniLibs/arm64-v8a/libopenlist.so
          ls -lh /home/runner/work/PocketNAS-Pro/PocketNAS-Pro/app/src/main/jniLibs/arm64-v8a/libopenlist.so

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketNAS-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Release Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketNAS-Release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
